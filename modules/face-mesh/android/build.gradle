// Peekaboo's MediaPipe face mesh camera output for Android (see docs/FACE_MESH.md).
// Built the same way as react-native-vision-camera-face-detector, which is also a VisionCamera v5 camera output.

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
// AGP 9 has Kotlin built in; only add the Kotlin plugin when nothing has added it yet.
if (project.extensions.findByName('kotlin') == null) {
  apply plugin: 'org.jetbrains.kotlin.android'
}

apply from: '../nitrogen/generated/android/PeekabooFaceMesh+autolinking.gradle'

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["PeekabooFaceMesh_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["PeekabooFaceMesh_" + name]).toInteger()
}

android {
  namespace "com.margelo.nitro.peekaboo.facemesh"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  // The face model lives once in ../assets (iPhone uses the same file).
  sourceSets {
    main {
      assets.srcDirs += ["${project.projectDir}/../assets"]
    }
  }

  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libc++_shared.so",
      "**/libNitroModules.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermes.so",
      "**/libhermes-executor-debug.so",
      "**/libhermes_executor.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libturbomodulejsijni.so",
      "**/libreact_nativemodule_core.so",
      "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  compileOnly "com.facebook.react:react-android"
  implementation "androidx.annotation:annotation:1.9.1"
  // CameraX ImageAnalysis (same version VisionCamera 5.2.4 uses)
  implementation "androidx.camera:camera-core:1.7.0-alpha03"
  // Google MediaPipe Tasks (Face Landmarker)
  implementation "com.google.mediapipe:tasks-vision:0.10.29"
  compileOnly project(":react-native-nitro-modules")
  compileOnly project(":react-native-vision-camera")
}
